<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <title>{% block title %}{{ APP_NAME }}{% endblock %} — {{ APP_NAME }}</title>
</head>
<body class="public-page">
  <header class="public-nav">
    {% include 'partials/_logo.html' %}
    <nav class="public-links" aria-label="Public navigation">
      <a class="{% if request.endpoint == 'main.landing' %}is-current{% endif %}" href="{{ url_for('main.landing') }}"><span aria-hidden="true">⌂</span> Home</a>
      <a class="{% if request.endpoint == 'main.about' %}is-current{% endif %}" href="{{ url_for('main.about') }}"><span aria-hidden="true">●</span> About</a>
      <a class="{% if request.endpoint == 'main.services' %}is-current{% endif %}" href="{{ url_for('main.services') }}"><span aria-hidden="true">✦</span> Services</a>
      <a class="{% if request.endpoint == 'main.contact' %}is-current{% endif %}" href="{{ url_for('main.contact') }}"><span aria-hidden="true">✉</span> Contact</a>
      <a class="{% if request.endpoint == 'main.terms' %}is-current{% endif %}" href="{{ url_for('main.terms') }}"><span aria-hidden="true">§</span> Terms</a>
    </nav>
    <div class="public-actions">
      <button class="icon-button theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
      <a class="button button-primary" href="{{ url_for('auth.login') }}">Staff login</a>
    </div>
  </header>
  {% include 'partials/_flash.html' %}
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">{{ APP_NAME }} Hospital Management System © 2026</footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
